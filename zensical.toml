[project]
site_name = "pygdb"
site_description = "A clean-room Python reader for Geosoft .gdb database and .grd grid files"
site_author = "Joseph Capriotti"
site_url = "https://jcapriot.github.io/pygdb/"
docs_dir = "docs"

nav = [
  { "Home" = "index.md" },
  { "Format specification" = "spec.md" },
  { "API reference" = "reference.md" },
  { "Contributing" = "contributing.md" },
  { "Provenance" = [
      "provenance/index.md",
      "provenance/notes.md",
      "provenance/log.md",
  ] },
]

# ----------------------------------------------------------------------------
# Plugins configuration
# ----------------------------------------------------------------------------
# mkdocstrings-python renders the "API reference" page's `::: pygdb...`
# directives from this package's own numpydoc-style docstrings (see
# CLAUDE.md's "Docstrings" section) -- `docstring_style = "numpy"` is
# what tells it to parse Parameters/Returns/Warns/Notes/etc. sections
# instead of its Google-style default.
[project.plugins.mkdocstrings.handlers.python]
paths = ["pygdb"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_root_heading = true
merge_init_into_class = true
