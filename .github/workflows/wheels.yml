name: Build wheels

# Builds the full release wheel matrix via cibuildwheel: one `abi3`
# wheel per platform (from the cp312 build, covers every non-free-
# threaded CPython >=3.12), one `abi3.abi3t` wheel per platform (from
# the cp315t build -- PEP 803, covers *both* GIL-enabled and free-
# threaded CPython >=3.15 with a single wheel), and one version-specific
# wheel per platform for 3.14's free-threaded build (cp314t, which has
# no stable-ABI option since abi3t starts at 3.15). See pyproject.toml's
# [tool.cibuildwheel] for the exact build selector and rust/src/lib.rs's
# module doc for what's shipped/why.
#
# Builds run on the same triggers as test.yml (push to main, every PR,
# manual dispatch) -- cross-arch Linux builds under QEMU are genuinely
# slow, but that's an accepted cost here, not something this workflow
# tries to avoid. The *build* jobs are deliberately ungated; only
# `publish`, at the bottom, is gated, and on a different trigger
# entirely (a GitHub Release being published) so an ordinary push/PR
# never has a path to actually uploading anything to PyPI.
#
# `publish` needs a PyPI "trusted publisher" configured for this
# repository (pypi.org project settings -> Publishing, pointing at this
# workflow file) before it can succeed -- until that's set up, it'll
# just fail cleanly on release rather than do nothing silently.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build_wheels:
    name: wheels / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    # Only a published GitHub Release actually uploads anything -- push
    # to main, every PR, and manual dispatch all build and upload
    # artifacts above (for inspection/testing) but stop there.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi  # matches the trusted publisher's environment name on PyPI -- see README/setup notes
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC) -- no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
